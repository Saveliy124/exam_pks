spring:
  application:
    name: exam-center-web
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55435/exam_center_kr3}
    username: ${SPRING_DATASOURCE_USERNAME:exam_web}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: exam-center
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.org}
    name: ${BOOTSTRAP_ADMIN_NAME:Администратор центра}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:true}
  import-limits:
    max-rows: 1000
