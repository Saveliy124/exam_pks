name: exam-center-kr2
x-backend: &backend
  image: exam-center-backend:3.0.0
  build:
    context: .
    dockerfile: backend/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "java", "-cp", "/app/probe", "ru.mirea.examcenter.server.HealthProbe"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 15s
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EXAM_DB_NAME:-exam_center}
      POSTGRES_USER: ${EXAM_DB_USER:-exam_center}
      POSTGRES_PASSWORD: ${EXAM_DB_PASSWORD:?Create .env using scripts/setup.sh}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "127.0.0.1:${EXAM_DB_PORT:-55433}:5432"
    volumes:
      - exam_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    <<: *backend
    environment:
      EXAM_DB_URL: jdbc:postgresql://postgres:5432/${EXAM_DB_NAME:-exam_center}
      EXAM_DB_USER: ${EXAM_DB_USER:-exam_center}
      EXAM_DB_PASSWORD: ${EXAM_DB_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:${EXAM_API_PORT:-8081}:8081"
  backend-demo:
    <<: *backend
    profiles: [demo]
    environment:
      EXAM_DB_URL: jdbc:postgresql://postgres:5432/${EXAM_DB_NAME:-exam_center}_demo
      EXAM_DB_USER: ${EXAM_DB_USER:-exam_center}
      EXAM_DB_PASSWORD: ${EXAM_DB_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:${EXAM_DEMO_API_PORT:-8082}:8081"
volumes:
  exam_data:
