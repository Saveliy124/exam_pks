name: Exam Center KR3
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exam_center_ci_test
          POSTGRES_USER: exam_test
          POSTGRES_PASSWORD: Test1!IsolatedDatabase
        ports: ['55435:5432']
        options: >-
          --health-cmd "pg_isready -U exam_test -d exam_center_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: mvn -B -pl web-backend -am verify -Pkr3-integration
        env:
          KR3_TEST_DB_URL: jdbc:postgresql://localhost:55435/exam_center_ci_test
          KR3_TEST_DB_USER: exam_test
          KR3_TEST_DB_PASSWORD: Test1!IsolatedDatabase
